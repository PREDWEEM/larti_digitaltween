name: Alerta de inicio por email

# Tras cada actualización meteorológica, calcula la alerta preventiva de inicio
# (primer pico modelado dentro de 7 días). Si aparece, abre un issue: GitHub lo
# envía por email a la cuenta del repositorio. Un solo aviso por campaña.
on:
  workflow_run:
    workflows: ["Actualizar meteorología Lartigau"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: alerta-inicio
  cancel-in-progress: false

jobs:
  alerta:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el repositorio actualizado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Calcular la alerta de inicio
        id: alerta
        run: python scripts/alerta_inicio.py --cuerpo alerta_inicio.md

      - name: Avisar por email (issue)
        if: steps.alerta.outputs.avisar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITULO: ${{ steps.alerta.outputs.titulo }}
        run: |
          if gh issue list --state all --label alerta-inicio --limit 200 --json title --jq '.[].title' | grep -Fxq "$TITULO"; then
            echo "Ya se avisó en esta campaña: $TITULO"
            exit 0
          fi
          gh label create alerta-inicio --color D93F0B \
            --description "Aviso automático de inicio de emergencia" 2>/dev/null || true
          gh issue create --title "$TITULO" --body-file alerta_inicio.md \
            --label alerta-inicio --assignee PREDWEEM
