name: Mantener activo el gemelo Lartigau

on:
  schedule:
    # Cada cuatro horas, fuera del inicio de la hora (horario UTC).
    - cron: "53 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/mantener_activo.yml
      - scripts/check_streamlit_app.py

permissions:
  contents: read

concurrency:
  group: mantener-activo-lartigau
  cancel-in-progress: false

jobs:
  visitar:
    if: github.repository == 'PREDWEEM/larti_digitaltween' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar navegador de comprobación
        run: |
          python -m pip install "playwright==1.58.0"
          python -m playwright install --with-deps chromium
      - name: Abrir y verificar el gemelo
        run: python scripts/check_streamlit_app.py
